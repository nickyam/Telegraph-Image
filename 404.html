<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>页面不存在 · 涯木云</title>
<style>
  html, body { min-height: 100%; margin: 0; }
  html { background: linear-gradient(160deg, #1b2440 0%, #35406b 45%, #6f5878 75%, #b3766a 100%) fixed; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #fff; min-height: 100vh; box-sizing: border-box;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 30px 16px; text-align: center;
  }
  .code {
    font-size: 72px; font-weight: 800; letter-spacing: .06em; line-height: 1; margin: 0 0 6px;
    background: linear-gradient(180deg, #ffffff 0%, #cfe6ff 55%, #9cc8ff 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    filter: drop-shadow(0 3px 16px rgba(0, 0, 0, .35));
  }
  .card {
    width: 100%; max-width: 420px; background: #fff; color: #2a3242;
    border-radius: 14px; padding: 26px 24px 28px; box-sizing: border-box;
    box-shadow: 0 12px 44px rgba(0, 0, 0, .30);
  }
  .card h1 { font-size: 17px; margin: 0 0 10px; }
  .card p { font-size: 13px; line-height: 1.8; color: #5e6878; margin: 0 0 18px; }
  .btn {
    display: inline-block; text-decoration: none; background: #0297f8; color: #fff;
    font-size: 13px; font-weight: 700; padding: 10px 24px; border-radius: 40px;
    box-shadow: 0 1px 2px rgba(2, 96, 160, .18), 0 4px 12px rgba(2, 151, 248, .22);
  }
  .btn:hover { background: #1ea3fa; }
</style>
</head>
<body>
  <p class="code">404</p>
  <div class="card">
    <h1>这个页面不在了</h1>
    <p>链接可能打错了，或者对应的文件已被删除。<br>如果你要找的是以前上传的图片，请回站点首页重新上传。</p>
    <a class="btn" href="/">回到首页</a>
  </div>
</body>
</html>
