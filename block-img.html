<!DOCTYPE html>
<html class="no-js" lang="en-US" style="
    height: 100%;
">
<head>
<title>The Image is blocked | Telegraph-Image</title>
<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0;padding:0}</style>
<script src="https://js.sentry-cdn.com/219f636ac7bde5edab2c3e16885cb535.min.js" crossorigin="anonymous"></script>
</head>
<body style="
    height: 100%;
">
    <div style="display: flex;flex-direction: column;align-content: center;justify-content: center;align-items: center;height: 100%;text-align: center;">
<div id="msg-blocked" style="display:none">
    抱歉，该文件已被管理员加入黑名单，无法进行加载。
    <br>
    Sorry, this file has been added to the administrator's blacklist and cannot be loaded.
</div>
<div id="msg-moderation">
    抱歉，当前图片未能通过审查，可能含有不良内容，故无法进行加载。
    <br>
    Sorry, the current image failed to pass the review and may contain undesirable content, so it cannot be loaded.
</div>
<script>
    try {
        var reason = new URLSearchParams(location.search).get('reason');
        if (reason === 'blocked') {
            document.getElementById('msg-blocked').style.display = '';
            document.getElementById('msg-moderation').style.display = 'none';
        }
    } catch (e) {}
</script>
</div>


</body></html>
