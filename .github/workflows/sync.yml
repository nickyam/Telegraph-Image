name: Upstream Sync

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *" # every day
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    name: Mirror upstream main into upstream-mirror
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v3

      # 只把上游 cf-pages/Telegraph-Image 的 main 镜像到 upstream-mirror 分支，
      # 供对照，绝不合并进本仓库的 main（main 已做大量定制：中文文案、零 KV
      # 写入、/file/* 30 天缓存 + 非 2xx no-store、上游只转发 Range/UA、壁纸按
      # 视口取尺寸、内链去 .html）。
      #
      # 关键坑：GITHUB_TOKEN（GitHub App 身份）无权新增/修改 .github/workflows/*
      # —— 报错 "without workflows permission"，但 permissions 里根本没有
      # workflows 这个 scope（只有 classic PAT 或 App 安装才有）。因此镜像分支
      # 把上游的 .github/workflows/ 剥掉再推，纯代码参考，不需要那些工作流。
      - name: Mirror upstream main to upstream-mirror
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/cf-pages/Telegraph-Image.git
          git fetch upstream main
          git checkout -B upstream-mirror "upstream/main"
          git rm -rq --ignore-unmatch .github/workflows
          git commit -qm "mirror: upstream main (workflows stripped)" || echo "no change"
          git push --force origin upstream-mirror
