name: Upstream Sync

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *" # every day
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    name: Mirror upstream main into upstream-mirror
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v3

      # 只把上游 cf-pages/Telegraph-Image 的 main 镜像到 upstream-mirror 分支，
      # 供对照，绝不合并进本仓库的 main（main 已做大量定制：中文文案、零 KV
      # 写入、/file/* 30 天缓存 + 非 2xx no-store、上游只转发 Range/UA、壁纸按
      # 视口取尺寸、内链去 .html）。
      # 用 --force 直接覆盖，不做 merge：原 aormsby/Fork-Sync action 是 git pull
      # 合并，一旦上游改到我们定制过的行就会冲突；而且它 git checkout
      # <目标分支> 时本地没有该分支会直接报 pathspec 错误。
      - name: Mirror upstream main to upstream-mirror
        run: |
          git remote add upstream https://github.com/cf-pages/Telegraph-Image.git
          git fetch upstream main
          git push --force origin "refs/remotes/upstream/main:refs/heads/upstream-mirror"
